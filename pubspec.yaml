name: two_eight_two
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 2.1.8+130 # Update this version number when you release a new version

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  sign_in_with_apple: ^8.2.0
  flutter_markdown_plus: ^1.0.12
  font_awesome_flutter: ^11.0.0
  google_sign_in: ^7.2.0
  percent_indicator: ^4.2.5
  intl: ^0.20.3
  cached_network_image: ^4.0.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  dotted_border: ^3.1.0
  shared_preferences: ^2.5.5
  shimmer: ^4.0.0
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^3.0.0
  photo_view: ^0.15.0
  flutter_rating_bar: ^4.0.1
  sentry_flutter: ^9.30.0
  http: ^1.6.0
  package_info_plus: ^10.2.1
  rate_my_app: ^2.4.1
  readmore: ^3.0.0
  device_info_plus: ^13.2.0
  confetti: ^0.8.0
  sliding_up_panel: ^2.0.0+1
  firebase_remote_config: ^6.7.0
  mixpanel_flutter: ^2.14.0
  flutter_branch_sdk: ^9.3.3
  share_plus: ^13.3.0
  mapbox_maps_flutter: ^2.30.1
  supabase_flutter: ^2.17.2
  flutter_svg: ^2.3.0
  animated_flip_counter: ^0.3.4
  flutter_lucide: ^1.46.0
  phosphoricons_flutter: ^1.0.0
  auto_size_text: ^3.0.0
  loading_animation_widget: ^1.3.0
  pinch_zoom_release_unzoom: ^2.0.0
  flutter_web_auth_2: ^5.1.0

  material_ui: ^1.3.0
  cupertino_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  mockito: ^5.8.1
  build_runner: ^2.16.1

flutter_native_splash:
  color: "#ffffff"
  image: "assets/icons/app_icon.png"
  android: true
  ios: true

flutter_launcher_icons:
  ios: true
  android: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  flavors:
    prod:
      android: true
      ios: true
      image_path: "assets/icons/app_icon.png"
      adaptive_icon_background: "#ffffff"
      adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
    dev:
      android: true
      ios: true
      image_path: "assets/icons/app_icon.png"
      adaptive_icon_background: "#ffffff"
      adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/weather/
    - assets/icons/
    - assets/munro-icons-svg/
    - assets/badges/
    - assets/branch-config.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans/NotoSans-Bold.ttf
        - asset: assets/fonts/NotoSans/NotoSans-Light.ttf
        - asset: assets/fonts/NotoSans/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans/NotoSans-SemiBold.ttf

  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
